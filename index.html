<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLO FRAMEWORK — Modular SPA</title>

  <!-- Erd-Texturen schon parallel zu den Skripten laden -->
  <link rel="preload" href="assets/earth-lights.png" as="image" crossorigin="anonymous" />
  <link rel="preload" href="assets/earth-clouds.jpg" as="image" crossorigin="anonymous" />
  <link rel="preload" href="assets/earth-height.png" as="image" crossorigin="anonymous" />

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components/nav.css" />
  <link rel="stylesheet" href="css/components/cursor.css" />
  <link rel="stylesheet" href="css/components/hud.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/modules/carousel.css" />
  <link rel="stylesheet" href="css/modules/sphere.css" />
  <link rel="stylesheet" href="css/modules/bvg.css" />
  <link rel="stylesheet" href="css/modules/weather.css" />
  <link rel="stylesheet" href="css/components/orbit.css" />
  <link rel="stylesheet" href="css/components/home-tiles.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/components/boot.css" />
  </head>

<body class="state-home is-booting">

<canvas id="bg-base" aria-hidden="true"></canvas>
<canvas id="bg-breath" aria-hidden="true"></canvas>
<div id="bg-ping"></div>
<canvas id="bg-stars" aria-hidden="true"></canvas>
<div id="cursor-flare"></div>

<nav id="nav-bar">
  <div id="brand-title">
    <i class="fa-solid fa-cube brand-icon"></i>
    HOLO <span>FRAMEWORK</span>
  </div>
  <button id="btn-back" class="nav-btn" title="Zurück zur Übersicht">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
</nav>

<div id="stage">
  <div id="orbit-stage"></div>

  <div id="carousel-slot" class="module-slot">
    <div class="module-inner" id="carousel-mount">
      <div class="carousel-wrapper" id="carousel-wrapper">
        <div class="carousel-track" id="carousel-track"></div>
      </div>
    </div>
  </div>

  <div id="sphere-slot" class="module-slot">
    <div class="module-inner" id="sphere-mount">
      <div class="sphere-wrapper" id="sphere-wrapper">
        <div class="gyro-ring gyro-ring-outer" id="ring-outer"></div>
        <div class="gyro-ring gyro-ring-inner" id="ring-inner"></div>
        <div id="sphere-core-dot"></div>
        <div id="sphere-anchor"></div>
        <div class="sphere-viewport" id="sphere-viewport"></div>
      </div>
    </div>
  </div>
</div>

<div id="dots-container"></div>
<div id="autoplay-progress"><div class="bar" id="autoplay-bar"></div></div>

<div id="bg-controls">
  <button id="btn-audio" class="bg-ctrl" title="Ton an/aus" aria-pressed="false">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>
  <button id="btn-stars-speed" class="bg-ctrl" title="Sternen-Geschwindigkeit" aria-pressed="false">
    <i class="fa-solid fa-forward"></i>
  </button>
  <button id="btn-stars-network" class="bg-ctrl" title="Sternen-Netzwerk" aria-pressed="true">
    <i class="fa-solid fa-circle-nodes"></i>
  </button>
</div>

<div id="app-version" aria-hidden="true"></div>

<div id="key-hints">← → · WHEEL · SPACE · DRAG</div>

<button id="btn-add-favorite" title="Favorit hinzufügen">
  <i class="fa-solid fa-plus"></i>
</button>

<div id="add-modal">
  <div id="modal-box">
    <div class="modal-header">
      <div class="modal-title-row">
        <div class="modal-title-icon">
          <i class="fa-solid fa-link"></i>
        </div>
        <div>
          <h3 class="modal-title">Favorit Hinzufügen</h3>
          <p class="modal-subtitle">Web-URL in 3D Kugel einbinden</p>
        </div>
      </div>
      <button id="modal-close-btn" class="nav-btn" title="Schließen">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="add-url-form">
      <div>
        <label class="modal-label">Web-Adresse (URL) *</label>
        <div class="modal-input-wrap">
          <i class="fa-solid fa-globe"></i>
          <input id="input-url" type="text" required placeholder="https://github.com" class="modal-input" />
        </div>
      </div>
      <div>
        <label class="modal-label">Name / Titel (Optional)</label>
        <div class="modal-input-wrap">
          <i class="fa-solid fa-bookmark"></i>
          <input id="input-title" type="text" placeholder="z.B. GitHub Vault" class="modal-input" />
        </div>
      </div>
      <div>
        <div class="modal-label modal-label-preview">Vorschau</div>
        <div class="preview-box">
          <div class="preview-icon-wrap">
            <i id="preview-fallback-icon" class="fa-solid fa-arrow-up-right-from-square"></i>
            <img id="preview-favicon" alt="favicon" />
          </div>
          <div class="preview-text">
            <span id="preview-title">Domain Name</span>
            <span id="preview-domain">https://domain.com</span>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="modal-btn-secondary">Abbrechen</button>
        <button type="submit" class="modal-btn-primary">
          <i class="fa-solid fa-check"></i>
          <span>Speichern</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
